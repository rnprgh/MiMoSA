[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MiMoSA"
version = "0.2.0"
description = "A Python framework for microbial motion segmentation, tracking, and analysis"
readme = "README.md"
authors = [{ name = "Dubnau Lab, Rutgers University" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "aicsimageio==4.14.0",
    "distfit==1.7.3",
    "ipywidgets==8.1.5",
    "matplotlib==3.7.5",
    "matplotlib-inline==0.1.6",
    "natsort==8.4.0",
    "numpy==1.24.4",
    "omnipose==1.1.4",
    "openpyxl==3.1.5",
    "opencv-python==4.9.0.80",
    "opencv-python-headless==4.9.0.80",
    "pandas==2.1.4",
    "scikit-image==0.20.0",
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "seaborn==0.13.2",
    "tifffile==2023.2.28",
    "torch-optimizer==0.3.0",
    "tqdm==4.66.2",
    "trackpy==0.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
